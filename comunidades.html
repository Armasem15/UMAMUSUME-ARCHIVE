<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmaWiki - Comunidades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #E5ECF9;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #333333;
    }
    a { color: #983b8c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .orkut-header {
      background-color: #b46d9c;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: white;
      border-bottom: 2px solid #983b77;
    }
    .orkut-logo {
      font-size: 22px;
      font-weight: bold;
      font-style: italic;
      color: #E41A82;
      background-color: #FFFFFF;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: -1px;
    }
    .orkut-logo span { color: #b46dae; }
    .nav-menu a { color: white; margin-left: 15px; font-weight: bold; font-size: 11px; }

    .main-container {
      max-width: 980px;
      margin: 15px auto;
      display: flex;
      gap: 12px;
      padding: 0 10px;
    }
    .col-left { width: 200px; flex-shrink: 0; }
    .col-center { flex: 1; min-width: 0; }
    .col-right { width: 260px; flex-shrink: 0; }

    .box {
      background-color: #FFFFFF;
      border: 1px solid #ffc3fb;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .box-header {
      background-color: #f1d4ef;
      color: #983b87;
      font-weight: bold;
      font-size: 11px;
      padding: 5px 8px;
      margin: -10px -10px 10px -10px;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      border-bottom: 1px solid #ffc3f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .side-menu { list-style: none; }
    .side-menu li { padding: 5px 0; border-bottom: 1px solid #E5ECF9; }
    .side-menu li:last-child { border-bottom: none; }
    .side-menu a { font-weight: bold; display: flex; align-items: center; gap: 6px; }

    /* Grid de Comunidades */
    .comm-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .comm-card {
      background: #FAFAFA;
      border: 1px solid #ffc3f5;
      border-radius: 4px;
      padding: 8px;
      display: flex;
      gap: 10px;
      transition: 0.2s;
      min-width: 0;
    }
    .comm-card:hover {
      background: #FFF;
      border-color: #983b87;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    }
    .comm-thumb {
      width: 75px;
      height: 75px;
      object-fit: cover;
      border: 1px solid #ffc3ea;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .comm-info { flex: 1; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .comm-title {
      font-size: 13px;
      font-weight: bold;
      color: #983b8c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tags-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 3px;
    }
    .comm-cat {
      display: inline-block;
      background: #f1d4ef;
      color: #983b87;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }
    .tag-oficial {
      display: inline-block;
      background: #d4edda;
      color: #155724;
      border: 1px solid #b1dfbb;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }
    .tag-nao-oficial {
      display: inline-block;
      background: #eeeeee;
      color: #666666;
      border: 1px solid #dddddd;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: bold;
    }
    .comm-desc {
      font-size: 11px;
      color: #555;
      margin-top: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .comm-meta { font-size: 10px; color: #888; margin-top: 5px; }

    /* Formulário Criar Comunidade */
    .form-group { margin-bottom: 8px; }
    label { display: block; font-weight: bold; color: #666; font-size: 11px; margin-bottom: 2px; }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 5px 7px;
      border: 1px solid #ffc3f0;
      border-radius: 3px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      background: #FFF;
    }
    textarea { height: 60px; resize: vertical; }
    .btn-orkut {
      background: #ECE9D8;
      border: 1px solid #b97fb0;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      border-radius: 2px;
      width: 100%;
    }
    .btn-orkut:hover { background: #F0EFE2; }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .col-left, .col-right { width: 100%; }
      .comm-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="orkut-header">
    <div class="orkut-logo">Uma <span>wiki</span></div>
    <nav class="nav-menu">
      <a href="editar.html">✏️ Editar Perfis</a>
      <a href="wiki.html">Início</a>
      <a href="wiki.html">Personagens</a>
      <a href="comunidades.html">Comunidades</a>
      <a href="criar.html">+ Novo Perfil</a>
    </nav>
  </header>

  <div class="main-container">
    <!-- COLUNA ESQUERDA -->
    <aside class="col-left">
      <div class="box">
        <div class="box-header">Menu</div>
        <ul class="side-menu">
          <li><a href="wiki.html">🏠 Página Inicial</a></li>
          <li><a href="wiki.html">👥 Personagens</a></li>
          <li><a href="comunidades.html">💬 Comunidades</a></li>
          <li><a href="criar.html">➕ Criar Personagem</a></li>
        </ul>
      </div>
    </aside>

    <!-- COLUNA CENTRAL: LISTA DE GRUPOS -->
    <main class="col-center">
      <div class="box">
        <div class="box-header">
          <span>Comunidades da UmaWiki</span>
          <span id="commCount" style="font-weight: normal; font-size: 10px;">Carregando...</span>
        </div>

        <div class="comm-grid" id="commGrid">
          <p style="color:#666;">Carregando comunidades...</p>
        </div>
      </div>
    </main>

    <!-- COLUNA DIREITA: CRIAR NOVA COMUNIDADE -->
    <aside class="col-right">
      <div class="box">
        <div class="box-header">➕ Criar Nova Comunidade</div>
        <form onsubmit="criarComunidade(event)">
          <div class="form-group">
            <label>Nome do Grupo *</label>
            <input type="text" id="commNome" required placeholder="Ex: Eu odeio acordar cedo">
          </div>
          <div class="form-group">
            <label>Status do Grupo</label>
            <select id="commOficial">
              <option value="Não Oficial">Não Oficial</option>
              <option value="Oficial">✅ Oficial</option>
            </select>
          </div>
          <div class="form-group">
            <label>Categoria</label>
            <select id="commCat">
              <option value="Equipes / Academias">Equipes / Academias</option>
              <option value="Humor & Memes">Humor & Memes</option>
              <option value="Corridas & Treinos">Corridas & Treinos</option>
              <option value="Culinária & Lanches">Culinária & Lanches</option>
              <option value="Geral">Geral</option>
            </select>
          </div>
          <div class="form-group">
            <label>URL da Foto do Grupo</label>
            <input type="text" id="commImg" placeholder="https://...">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <textarea id="commDesc" placeholder="Sobre o que é essa comunidade?"></textarea>
          </div>
          <button type="submit" class="btn-orkut" id="btnCriarComm">Criar Comunidade</button>
        </form>
      </div>
    </aside>
  </div>

  <script>
    const SUPABASE_URL = 'https://sxgclsyumorpwogtffwg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9sFpZtTu1jkrNn1E6_78_Q_Bd9Mago9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const DEFAULT_IMG = 'https://preview.redd.it/msn-frutiger-aero-symbol-but-it-went-rogue-and-became-dark-v0-q3akdrcrrp5f1.jpeg?width=640&crop=smart&auto=webp&s=3c6bc8247bc94b7572dad65fbe49b1afcc4ce5b7';

    async function carregarComunidades() {
      const { data, error } = await supabaseClient
        .from('comunidades')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('commGrid').innerHTML = '<p style="color:red;">Erro ao carregar comunidades.</p>';
        return;
      }

      const lista = data || [];
      document.getElementById('commCount').innerText = `${lista.length} comunidades`;

      if (lista.length === 0) {
        document.getElementById('commGrid').innerHTML = '<p style="color:#666;">Nenhuma comunidade criada ainda. Crie a primeira ao lado!</p>';
        return;
      }

      document.getElementById('commGrid').innerHTML = lista.map(c => {
        const qtdMembros = Array.isArray(c.membros_ids) ? c.membros_ids.length : 0;
        const isOficial = c.status_oficial === 'Oficial';
        const badgeStatus = isOficial
          ? `<span class="tag-oficial">✅ Oficial</span>`
          : `<span class="tag-nao-oficial">Não Oficial</span>`;

        return `
          <a href="comunidade.html?id=${c.id}" style="text-decoration: none;">
            <div class="comm-card">
              <img class="comm-thumb" src="${c.imagem_url || DEFAULT_IMG}" alt="${c.nome}" onerror="this.src='${DEFAULT_IMG}'">
              <div class="comm-info">
                <div>
                  <div class="comm-title" title="${c.nome}">${c.nome}</div>
                  <div class="tags-row">
                    ${badgeStatus}
                    <span class="comm-cat">${c.categoria || 'Geral'}</span>
                  </div>
                  <div class="comm-desc">${c.descricao || 'Sem descrição.'}</div>
                </div>
                <div class="comm-meta">👥 <strong>${qtdMembros}</strong> membros &bull; Entrar &raquo;</div>
              </div>
            </div>
          </a>
        `;
      }).join('');
    }

    async function criarComunidade(e) {
      e.preventDefault();
      const btn = document.getElementById('btnCriarComm');
      btn.disabled = true;
      btn.innerText = 'Criando...';

      const nova = {
        nome: document.getElementById('commNome').value.trim(),
        status_oficial: document.getElementById('commOficial').value,
        categoria: document.getElementById('commCat').value,
        imagem_url: document.getElementById('commImg').value.trim(),
        descricao: document.getElementById('commDesc').value.trim(),
        membros_ids: []
      };

      const { data, error } = await supabaseClient
        .from('comunidades')
        .insert([nova])
        .select()
        .single();

      if (error) {
        alert('Erro ao criar comunidade: ' + error.message);
        btn.disabled = false;
        btn.innerText = 'Criar Comunidade';
        return;
      }

      window.location.href = `comunidade.html?id=${data.id}`;
    }

    carregarComunidades();
  </script>
</body>
</html>
