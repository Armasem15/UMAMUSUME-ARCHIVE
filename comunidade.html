<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmaWiki - Comunidade</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #E5ECF9;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #333333;
    }
    a { color: #983b8c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .orkut-header {
      background-color: #b46d9c;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: white;
      border-bottom: 2px solid #983b77;
    }
    .orkut-logo {
      font-size: 22px;
      font-weight: bold;
      font-style: italic;
      color: #E41A82;
      background-color: #FFFFFF;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: -1px;
    }
    .orkut-logo span { color: #b46dae; }
    .nav-menu a { color: white; margin-left: 15px; font-weight: bold; font-size: 11px; }

    .main-container {
      max-width: 980px;
      margin: 15px auto;
      display: flex;
      gap: 12px;
      padding: 0 10px;
    }
    .col-left { width: 200px; flex-shrink: 0; }
    .col-center { flex: 1; min-width: 0; }
    .col-right { width: 250px; flex-shrink: 0; }

    .box {
      background-color: #FFFFFF;
      border: 1px solid #ffc3fb;
      border-radius: 4px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .box-header {
      background-color: #f1d4ef;
      color: #983b87;
      font-weight: bold;
      font-size: 11px;
      padding: 5px 8px;
      margin: -10px -10px 10px -10px;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      border-bottom: 1px solid #ffc3f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .comm-avatar {
      width: 100%;
      height: auto;
      border-radius: 3px;
      border: 1px solid #ffc3f4;
    }
    .action-list { list-style: none; margin-top: 10px; }
    .action-list li { margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }

    .comm-title { font-size: 20px; color: #983b7e; font-weight: bold; margin-bottom: 4px; }
    .comm-meta { font-size: 11px; color: #666; margin-bottom: 10px; }

    .info-table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
    .info-table td { padding: 5px 6px; border-bottom: 1px solid #F0F4FC; vertical-align: top; }
    .info-table .label {
      width: 120px;
      font-weight: bold;
      color: #666;
      text-align: right;
      padding-right: 10px;
    }

    .quick-add-box {
      background: #F4F7FC;
      border: 1px solid #C3D9FF;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      display: flex;
      gap: 6px;
    }
    .quick-add-box select {
      flex: 1;
      padding: 4px;
      border: 1px solid #ffc3f0;
      border-radius: 3px;
      font-size: 11px;
      min-width: 0;
    }
    .btn-orkut {
      background: #ECE9D8;
      border: 1px solid #b97fb0;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      border-radius: 2px;
      white-space: nowrap;
    }
    .btn-orkut:hover { background: #F0EFE2; }

    .members-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      text-align: center;
    }
    .member-card {
      position: relative;
      background: #FAFAFA;
      border: 1px solid #E5ECF9;
      border-radius: 3px;
      padding: 4px;
      min-width: 0;
    }
    .member-card img {
      width: 100%;
      height: 55px;
      object-fit: cover;
      border-radius: 2px;
      border: 1px solid #ffc3fa;
      display: block;
    }
    .member-card span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-kick {
      position: absolute;
      top: 2px;
      right: 2px;
      background: rgba(220, 38, 38, 0.9);
      color: #FFF;
      border: none;
      border-radius: 2px;
      font-size: 9px;
      font-weight: bold;
      padding: 1px 4px;
      cursor: pointer;
      line-height: 1.2;
    }
    .btn-kick:hover { background: #990000; }

    .topic-item {
      background: #F9FAFC;
      border: 1px solid #E5ECF9;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .topic-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #983b8c;
      margin-bottom: 4px;
    }
    .topic-form input, .topic-form textarea {
      width: 100%;
      padding: 5px;
      border: 1px solid #ffc3f0;
      border-radius: 3px;
      font-size: 11px;
      margin-top: 5px;
      font-family: Arial, sans-serif;
    }
    .topic-form textarea { height: 55px; resize: vertical; }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .col-left, .col-right { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="orkut-header">
    <div class="orkut-logo">Uma <span>wiki</span></div>
    <nav class="nav-menu">
      <a href="wiki.html">Início</a>
      <a href="comunidades.html">Comunidades</a>
      <a href="criar.html">+ Criar Perfil</a>
      <a href="editar.html">✏️ Editar Perfis</a>
    </nav>
  </header>

  <div class="main-container">
    <!-- COLUNA ESQUERDA -->
    <aside class="col-left">
      <div class="box">
        <img id="commAvatar" class="comm-avatar" src="https://preview.redd.it/msn-frutiger-aero-symbol-but-it-went-rogue-and-became-dark-v0-q3akdrcrrp5f1.jpeg?width=640&crop=smart&auto=webp&s=3c6bc8247bc94b7572dad65fbe49b1afcc4ce5b7" alt="Comunidade">
        <ul class="action-list">
          <li>✏️ <a id="linkEditarComm" href="#">Editar Comunidade</a></li>
          <li>🏘️ <a href="comunidades.html">Ver Todas Comunidades</a></li>
          <li>🏠 <a href="wiki.html">Voltar ao Início</a></li>
        </ul>
      </div>
    </aside>

    <!-- COLUNA CENTRAL -->
    <main class="col-center">
      <div class="box">
        <h1 class="comm-title" id="commNome">Carregando...</h1>
        <div class="comm-meta" id="commMeta">...</div>

        <table class="info-table">
          <tr>
            <td class="label">Descrição:</td>
            <td id="commDescricao" style="white-space: pre-line;">Sem descrição.</td>
          </tr>
          <tr>
            <td class="label">Categoria:</td>
            <td id="commCategoria">Geral</td>
          </tr>
          <tr id="rowDono" style="display:none;">
            <td class="label">Dono(a):</td>
            <td id="commDono">-</td>
          </tr>
          <tr>
            <td class="label">Membros:</td>
            <td id="commTotalMembros">0</td>
          </tr>
        </table>
      </div>

      <!-- FÓRUM DA COMUNIDADE -->
      <div class="box" id="forumBox" style="display:none;">
        <div class="box-header">
          <span>Fórum / Tópicos da Comunidade</span>
        </div>
        <div id="topicosLista"></div>

        <div class="topic-form" style="background:#F4F7FC; padding:8px; border:1px solid #ffc3f4; border-radius:4px; margin-top:10px;">
          <strong style="color:#983b82;">Criar novo tópico:</strong>
          <select id="topicoAutorSelect" style="width:100%; padding:5px; border:1px solid #ffc3f0; border-radius:3px; margin-top:5px; font-size:11px;"></select>
          <input type="text" id="topicoTitulo" placeholder="Assunto do tópico">
          <textarea id="topicoTexto" placeholder="Escreva sua mensagem..."></textarea>
          <button type="button" class="btn-orkut" style="margin-top:5px;" onclick="criarTopico()">Postar Tópico</button>
        </div>
      </div>
    </main>

    <!-- COLUNA DIREITA: MEMBROS -->
    <aside class="col-right">
      <div class="box">
        <div class="box-header">
          <span id="membrosCount">Membros (0)</span>
          <a id="linkGerenciarMembros" href="#">gerenciar</a>
        </div>

        <div class="quick-add-box">
          <select id="selectAddMembro">
            <option value="">Adicionar membro...</option>
          </select>
          <button type="button" class="btn-orkut" onclick="adicionarMembroRapido()">+ Entrar</button>
        </div>

        <div class="members-grid" id="membrosGrid"></div>
      </div>
    </aside>
  </div>

  <script>
    const SUPABASE_URL = 'https://sxgclsyumorpwogtffwg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9sFpZtTu1jkrNn1E6_78_Q_Bd9Mago9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    const DEFAULT_AVATAR = 'https://preview.redd.it/msn-frutiger-aero-symbol-but-it-went-rogue-and-became-dark-v0-q3akdrcrrp5f1.jpeg?width=640&crop=smart&auto=webp&s=3c6bc8247bc94b7572dad65fbe49b1afcc4ce5b7';

    let comunidadeAtual = null;
    let todosPersonagens = [];
    let membrosIds = [];

    async function carregarPagina() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      let query = supabaseClient.from('comunidades').select('*');
      query = id ? query.eq('id', id).single() : query.limit(1).single();

      const [resComm, resChars] = await Promise.all([
        query,
        supabaseClient.from('personagens').select('id, nome, avatar_url, comunidades').order('nome', { ascending: true })
      ]);

      if (resComm.error || !resComm.data) {
        document.getElementById('commNome').innerText = 'Comunidade não encontrada';
        return;
      }

      comunidadeAtual = resComm.data;
      todosPersonagens = resChars.data || [];

      document.getElementById('linkEditarComm').href = `editar-comunidade.html?id=${comunidadeAtual.id}`;
      document.getElementById('linkGerenciarMembros').href = `editar-comunidade.html?id=${comunidadeAtual.id}`;

      // Sincroniza lista de membros a partir de membros_ids e dos perfis
      const idsTabela = Array.isArray(comunidadeAtual.membros_ids) ? comunidadeAtual.membros_ids.map(Number) : [];
      const idsPerfis = todosPersonagens
        .filter(p => Array.isArray(p.comunidades) && p.comunidades.some(item =>
          item.id === comunidadeAtual.id || (item.nome || '').toLowerCase() === (comunidadeAtual.nome || '').toLowerCase()
        ))
        .map(p => p.id);

      membrosIds = [...new Set([...idsTabela, ...idsPerfis])].filter(mid =>
        todosPersonagens.some(p => p.id === mid)
      );

      renderizarTudo();
    }

    function renderizarTudo() {
      const c = comunidadeAtual;
      document.title = `UmaWiki - ${c.nome}`;
      document.getElementById('commNome').innerText = c.nome;
      document.getElementById('commAvatar').src = c.imagem_url || DEFAULT_AVATAR;
      document.getElementById('commCategoria').innerText = c.categoria || 'Geral';
      document.getElementById('commDescricao').innerText = c.descricao || 'Nenhuma descrição cadastrada.';
      document.getElementById('commMeta').innerText = `Categoria: ${c.categoria || 'Geral'} • ${membrosIds.length} participante(s)`;
      document.getElementById('commTotalMembros').innerText = membrosIds.length;

      if ('dono_id' in c && c.dono_id) {
        const dono = todosPersonagens.find(p => p.id === c.dono_id);
        if (dono) {
          document.getElementById('rowDono').style.display = 'table-row';
          document.getElementById('commDono').innerHTML = `<a href="perfil.html?id=${dono.id}">${dono.nome}</a>`;
        }
      }

      // Dropdown de adicionar membro
      const naoMembros = todosPersonagens.filter(p => !membrosIds.includes(p.id));
      const selAdd = document.getElementById('selectAddMembro');
      selAdd.innerHTML = naoMembros.length
        ? `<option value="">Adicionar personagem...</option>` +
          naoMembros.map(p => `<option value="${p.id}">${p.nome}</option>`).join('')
        : `<option value="">Todos já participam</option>`;

      // Grid de membros com botão de remover (✕)
      document.getElementById('membrosCount').innerText = `Membros (${membrosIds.length})`;
      const grid = document.getElementById('membrosGrid');

      if (membrosIds.length === 0) {
        grid.innerHTML = '<p style="grid-column:1/-1; color:#777; font-size:10px;">Nenhum membro neste grupo.</p>';
      } else {
        grid.innerHTML = membrosIds.map(id => {
          const p = todosPersonagens.find(x => x.id === id);
          if (!p) return '';
          return `
            <div class="member-card" title="${p.nome}">
              <button type="button" class="btn-kick" onclick="removerParticipante(${p.id})" title="Remover ${p.nome} do grupo">✕</button>
              <a href="perfil.html?id=${p.id}">
                <img src="${p.avatar_url || DEFAULT_AVATAR}" alt="${p.nome}" onerror="this.src='${DEFAULT_AVATAR}'">
                <span>${p.nome}</span>
              </a>
            </div>
          `;
        }).join('');
      }

      // Fórum se existir coluna topicos
      if ('topicos' in c) {
        document.getElementById('forumBox').style.display = 'block';
        const selAutor = document.getElementById('topicoAutorSelect');
        selAutor.innerHTML = todosPersonagens.map(p => `<option value="${p.id}">${p.nome}</option>`).join('');
        renderizarTopicos(c.topicos || []);
      }
    }

    async function adicionarMembroRapido() {
      const novoId = parseInt(document.getElementById('selectAddMembro').value);
      if (isNaN(novoId) || membrosIds.includes(novoId)) return;

      const novaListaIds = [...membrosIds, novoId];
      const { error } = await supabaseClient
        .from('comunidades')
        .update({ membros_ids: novaListaIds })
        .eq('id', comunidadeAtual.id);

      if (error) {
        alert('Erro ao adicionar participante: ' + error.message);
        return;
      }

      // Atualiza também no perfil do personagem
      const person = todosPersonagens.find(p => p.id === novoId);
      if (person) {
        const atuais = Array.isArray(person.comunidades) ? person.comunidades : [];
        const jaTem = atuais.some(c => c.id === comunidadeAtual.id);
        if (!jaTem) {
          const atualizadas = [...atuais, {
            id: comunidadeAtual.id,
            nome: comunidadeAtual.nome,
            avatar: comunidadeAtual.imagem_url || ''
          }];
          await supabaseClient.from('personagens').update({ comunidades: atualizadas }).eq('id', novoId);
          person.comunidades = atualizadas;
        }
      }

      membrosIds = novaListaIds;
      renderizarTudo();
    }

    async function removerParticipante(personagemId) {
      const person = todosPersonagens.find(p => p.id === personagemId);
      const nome = person ? person.nome : 'este participante';

      if (!confirm(`Remover "${nome}" da comunidade "${comunidadeAtual.nome}"?`)) return;

      const novaListaIds = membrosIds.filter(id => id !== personagemId);
      const { error } = await supabaseClient
        .from('comunidades')
        .update({ membros_ids: novaListaIds })
        .eq('id', comunidadeAtual.id);

      if (error) {
        alert('Erro ao remover participante: ' + error.message);
        return;
      }

      // Remove a comunidade do JSON do perfil do personagem
      if (person) {
        const atuais = Array.isArray(person.comunidades) ? person.comunidades : [];
        const filtradas = atuais.filter(c =>
          c.id !== comunidadeAtual.id && (c.nome || '').toLowerCase() !== (comunidadeAtual.nome || '').toLowerCase()
        );
        await supabaseClient.from('personagens').update({ comunidades: filtradas }).eq('id', personagemId);
        person.comunidades = filtradas;
      }

      membrosIds = novaListaIds;
      renderizarTudo();
    }

    function renderizarTopicos(topicos) {
      const lista = Array.isArray(topicos) ? topicos : [];
      const container = document.getElementById('topicosLista');
      container.innerHTML = lista.length
        ? lista.map(t => `
          <div class="topic-item">
            <div class="topic-header">
              <span>${t.titulo}</span>
              <span style="font-weight:normal; font-size:10px; color:#777;">por ${t.autor || 'Anônimo'} (${t.data || ''})</span>
            </div>
            <p style="color:#444;">${t.texto}</p>
          </div>
        `).join('')
        : '<p style="color:#666;">Nenhum tópico criado ainda.</p>';
    }

    async function criarTopico() {
      const autorId = parseInt(document.getElementById('topicoAutorSelect').value);
      const autorObj = todosPersonagens.find(p => p.id === autorId);
      const titulo = document.getElementById('topicoTitulo').value.trim();
      const texto = document.getElementById('topicoTexto').value.trim();

      if (!titulo || !texto) {
        alert('Preencha o assunto e a mensagem do tópico!');
        return;
      }

      const novoTopico = {
        autor: autorObj ? autorObj.nome : 'Membro',
        titulo,
        texto,
        data: new Date().toLocaleDateString('pt-BR')
      };

      const novosTopicos = [...(comunidadeAtual.topicos || []), novoTopico];
      const { error } = await supabaseClient
        .from('comunidades')
        .update({ topicos: novosTopicos })
        .eq('id', comunidadeAtual.id);

      if (error) {
        alert('Erro ao criar tópico: ' + error.message);
        return;
      }

      comunidadeAtual.topicos = novosTopicos;
      renderizarTopicos(novosTopicos);
      document.getElementById('topicoTitulo').value = '';
      document.getElementById('topicoTexto').value = '';
    }

    carregarPagina();
  </script>
</body>
</html>
