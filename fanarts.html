<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UmaWiki - Galeria de Fanarts</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #E5ECF9;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      color: #333333;
    }
    a { color: #983b8c; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .orkut-header {
      background-color: #b46d9c;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: white;
      border-bottom: 2px solid #983b77;
    }
    .orkut-logo {
      font-size: 22px;
      font-weight: bold;
      font-style: italic;
      color: #E41A82;
      background-color: #FFFFFF;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: -1px;
    }
    .orkut-logo span { color: #b46dae; }
    .nav-menu a { color: white; margin-left: 15px; font-weight: bold; font-size: 11px; }

    .container { max-width: 980px; margin: 16px auto; padding: 0 10px; }

    .box {
      background-color: #FFFFFF;
      border: 1px solid #ffc3fb;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .box-header {
      background-color: #f1d4ef;
      color: #983b87;
      font-weight: bold;
      font-size: 12px;
      padding: 6px 10px;
      margin: -12px -12px 12px -12px;
      border-top-left-radius: 3px;
      border-top-right-radius: 3px;
      border-bottom: 1px solid #ffc3f4;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-orkut {
      background: #ECE9D8;
      border: 1px solid #b97fb0;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      border-radius: 2px;
    }
    .btn-orkut:hover { background: #F0EFE2; }

    .btn-pink {
      background: linear-gradient(180deg, #f23898, #c91270);
      color: white;
      border: 1px solid #8a0c4d;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 3px;
    }
    .btn-pink:hover { background: linear-gradient(180deg, #ff47a6, #d6187a); }

    /* FORMULÁRIO DE ENVIO */
    .upload-form {
      display: none;
      background: #FFF9FD;
      border: 1px dashed #E41A82;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 14px;
    }
    .upload-layout {
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .art-preview-box {
      width: 150px;
      flex-shrink: 0;
      text-align: center;
      background: #FFF;
      border: 1px solid #ffc3f4;
      padding: 6px;
      border-radius: 4px;
    }
    .art-preview-box img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 3px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 1;
    }
    .form-group.full { grid-column: 1 / -1; }
    label {
      display: block;
      font-weight: bold;
      color: #666;
      margin-bottom: 3px;
      font-size: 11px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ffc3f0;
      border-radius: 3px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      background: #FFF;
    }
    textarea { height: 60px; resize: vertical; }

    /* BARRA DE FILTROS */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      background: #F4F7FC;
      padding: 8px;
      border: 1px solid #C3D9FF;
      border-radius: 4px;
      flex-wrap: wrap;
    }
    .filter-bar input, .filter-bar select {
      flex: 1;
      min-width: 180px;
    }

    /* GRADE DE FANARTS */
    .fanart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 12px;
    }
    .fanart-card {
      background: #FAFAFA;
      border: 1px solid #C3D9FF;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.12s;
    }
    .fanart-card:hover {
      border-color: #E41A82;
      transform: translateY(-2px);
    }
    .fanart-thumb {
      width: 100%;
      height: 190px;
      object-fit: cover;
      cursor: pointer;
      border-bottom: 1px solid #ffc3f4;
      background: #FFF;
    }
    .fanart-info {
      padding: 8px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .fanart-title {
      font-weight: bold;
      color: #983b8c;
      font-size: 13px;
      margin-bottom: 3px;
      cursor: pointer;
    }
    .fanart-artist {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
    }
    .fanart-tag {
      display: inline-block;
      background: #f1d4ef;
      color: #983b87;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      margin-bottom: 6px;
      align-self: flex-start;
    }
    .fanart-footer {
      margin-top: auto;
      padding-top: 6px;
      border-top: 1px solid #E5ECF9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
    }

    /* MODAL LIGHTBOX */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    .modal-box {
      background: #FFF;
      border: 2px solid #b46d9c;
      border-radius: 5px;
      max-width: 820px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 14px;
    }
    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ffc3f4;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .modal-content-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
    }
    .modal-img-wrap {
      background: #111;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .modal-img-wrap img {
      max-width: 100%;
      max-height: 460px;
      object-fit: contain;
    }
    .comment-list {
      max-height: 180px;
      overflow-y: auto;
      background: #F9FAFC;
      border: 1px solid #E5ECF9;
      padding: 6px;
      border-radius: 3px;
      margin: 8px 0;
    }
    .comment-item {
      border-bottom: 1px dashed #ffc3f0;
      padding: 5px 0;
      font-size: 11px;
    }
    .comment-item:last-child { border-bottom: none; }

    @media (max-width: 700px) {
      .upload-layout, .modal-content-grid { grid-template-columns: 1fr; flex-direction: column; }
      .art-preview-box { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header class="orkut-header">
    <div class="orkut-logo">Uma <span>wiki</span></div>
    <nav class="nav-menu">
      <a href="wiki.html">Início</a>
      <a href="comunidades.html">Comunidades</a>
      <a href="jogos.html">🎮 Jogos</a>
      <a href="fanarts.html">🎨 Fanarts</a>
      <a href="criar.html">+ Novo Perfil</a>
      <a href="editar.html">✏️ Editar Perfis</a>
    </nav>
  </header>

  <div class="container">
    <div class="box">
      <div class="box-header">
        <span id="fanartHeaderCount">🎨 Galeria de Fanarts da UmaWiki (0)</span>
        <button type="button" class="btn-orkut" onclick="toggleFormFanart()">+ Publicar Fanart</button>
      </div>

      <!-- FORMULÁRIO DE NOVA FANART -->
      <form id="formFanart" class="upload-form" onsubmit="salvarFanart(event)">
        <div class="upload-layout">
          <div class="art-preview-box">
            <img id="artPreview" src="https://preview.redd.it/msn-frutiger-aero-symbol-but-it-went-rogue-and-became-dark-v0-q3akdrcrrp5f1.jpeg?width=640&crop=smart&auto=webp&s=3c6bc8247bc94b7572dad65fbe49b1afcc4ce5b7" alt="Prévia">
            <span style="display:block; font-size:10px; color:#777; margin-top:4px;">Prévia da Arte</span>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>Título da Fanart *</label>
              <input type="text" id="artTitulo" required placeholder="Ex: Goldship na linha de chegada">
            </div>
            <div class="form-group">
              <label>Artista / Autor *</label>
              <input type="text" id="artArtista" required placeholder="Seu nome ou @artista">
            </div>
            <div class="form-group full">
              <label>URL da Imagem *</label>
              <input type="text" id="artUrl" required placeholder="https://..." oninput="atualizarPreview(this.value)">
            </div>
            <div class="form-group">
              <label>Personagem Retratado (Opcional)</label>
              <select id="artPersonagem">
                <option value="">Geral / Vários personagens</option>
              </select>
            </div>
            <div class="form-group">
              <label>Estilo / Categoria</label>
              <select id="artCategoria">
                <option value="Arte Digital">Arte Digital</option>
                <option value="Desenho Tradicional">Desenho Tradicional</option>
                <option value="Tirinha / Meme">Tirinha / Meme</option>
                <option value="Chibi / Pixel Art">Chibi / Pixel Art</option>
              </select>
            </div>
            <div class="form-group full">
              <label>Descrição / Comentário do Artista</label>
              <textarea id="artDescricao" placeholder="Conte como fez o desenho ou deixe uma dedicatória..."></textarea>
            </div>
            <div class="form-group full">
              <button type="submit" class="btn-pink" id="btnSalvarArt">🎨 Publicar na Galeria</button>
            </div>
          </div>
        </div>
      </form>

      <!-- BARRA DE FILTRO -->
      <div class="filter-bar">
        <input type="text" id="buscaTexto" placeholder="🔍 Buscar por título ou artista..." oninput="renderizarGaleria()">
        <select id="filtroPersonagem" onchange="renderizarGaleria()">
          <option value="">Todos os personagens</option>
        </select>
        <select id="filtroCategoria" onchange="renderizarGaleria()">
          <option value="">Todas as categorias</option>
          <option value="Arte Digital">Arte Digital</option>
          <option value="Desenho Tradicional">Desenho Tradicional</option>
          <option value="Tirinha / Meme">Tirinha / Meme</option>
          <option value="Chibi / Pixel Art">Chibi / Pixel Art</option>
        </select>
      </div>

      <!-- GRADE DA GALERIA -->
      <div class="fanart-grid" id="fanartGrid">
        <p style="color:#666;">Carregando fanarts...</p>
      </div>
    </div>
  </div>

  <!-- MODAL DE VISUALIZAÇÃO DA FANART -->
  <div class="modal-overlay" id="artModal" onclick="fecharModalFora(event)">
    <div class="modal-box">
      <div class="modal-top">
        <strong id="modalTitulo" style="font-size:15px; color:#983b8c;">Título</strong>
        <button type="button" class="btn-orkut" onclick="fecharModal()">✕ Fechar</button>
      </div>

      <div class="modal-content-grid">
        <div class="modal-img-wrap">
          <img id="modalImg" src="" alt="Fanart">
        </div>

        <div>
          <p style="margin-bottom:4px;"><strong>Artista:</strong> <span id="modalArtista"></span></p>
          <p style="margin-bottom:4px;"><strong>Personagem:</strong> <span id="modalPersonagem"></span></p>
          <p style="margin-bottom:8px;"><strong>Categoria:</strong> <span id="modalCategoria"></span></p>
          <p id="modalDescricao" style="background:#F9FAFC; border:1px solid #E5ECF9; padding:8px; border-radius:4px; margin-bottom:10px; white-space:pre-line;"></p>

          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <button type="button" class="btn-pink" id="modalBtnLike" onclick="curtirArtModal()">❤️ Curtir (0)</button>
            <button type="button" class="btn-orkut" style="color:#a00;" onclick="excluirArtModal()">🗑️ Excluir</button>
          </div>

          <strong style="color:#983b87;">💬 Comentários:</strong>
          <div class="comment-list" id="modalComentarios"></div>

          <input type="text" id="comentAutor" placeholder="Seu nome" style="margin-bottom:5px;">
          <input type="text" id="comentTexto" placeholder="Escreva um comentário..." style="margin-bottom:5px;">
          <button type="button" class="btn-orkut" onclick="enviarComentarioModal()">Comentar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://sxgclsyumorpwogtffwg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_9sFpZtTu1jkrNn1E6_78_Q_Bd9Mago9';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    const DEFAULT_IMG = 'https://preview.redd.it/msn-frutiger-aero-symbol-but-it-went-rogue-and-became-dark-v0-q3akdrcrrp5f1.jpeg?width=640&crop=smart&auto=webp&s=3c6bc8247bc94b7572dad65fbe49b1afcc4ce5b7';

    let personagens = [];
    let fanarts = [];
    let artAbertaId = null;

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function atualizarPreview(url) {
      const img = document.getElementById('artPreview');
      img.src = url.trim() || DEFAULT_IMG;
      img.onerror = () => { img.src = DEFAULT_IMG; };
    }

    function toggleFormFanart() {
      const form = document.getElementById('formFanart');
      form.style.display = form.style.display === 'block' ? 'none' : 'block';
    }

    async function iniciar() {
      const [resChars, resArts] = await Promise.all([
        supabaseClient.from('personagens').select('id, nome').order('nome', { ascending: true }),
        supabaseClient.from('fanarts').select('*').order('created_at', { ascending: false })
      ]);

      personagens = resChars.data || [];
      fanarts = resArts.data || [];

      const opcoesChars = personagens.map(p => `<option value="${p.id}">${escapeHtml(p.nome)}</option>`).join('');
      document.getElementById('artPersonagem').innerHTML = `<option value="">Geral / Vários personagens</option>` + opcoesChars;
      document.getElementById('filtroPersonagem').innerHTML = `<option value="">Todos os personagens</option>` + opcoesChars;

      if (resArts.error) {
        document.getElementById('fanartGrid').innerHTML = `
          <p style="color:#a00; grid-column:1/-1;">
            ⚠️ Tabela <strong>fanarts</strong> ainda não encontrada no Supabase. Rode o SQL de criação para habilitar a galeria!
          </p>`;
        return;
      }

      renderizarGaleria();
    }

    function renderizarGaleria() {
      const busca = document.getElementById('buscaTexto').value.trim().toLowerCase();
      const filtroChar = document.getElementById('filtroPersonagem').value;
      const filtroCat = document.getElementById('filtroCategoria').value;

      const filtradas = fanarts.filter(art => {
        const matchTexto = !busca ||
          (art.titulo || '').toLowerCase().includes(busca) ||
          (art.artista || '').toLowerCase().includes(busca);
        const matchChar = !filtroChar || String(art.personagem_id) === String(filtroChar);
        const matchCat = !filtroCat || art.categoria === filtroCat;
        return matchTexto && matchChar && matchCat;
      });

      document.getElementById('fanartHeaderCount').innerText = `🎨 Galeria de Fanarts da UmaWiki (${filtradas.length})`;
      const grid = document.getElementById('fanartGrid');

      if (filtradas.length === 0) {
        grid.innerHTML = '<p style="color:#666; grid-column:1/-1;">Nenhuma fanart encontrada com esses filtros.</p>';
        return;
      }

      grid.innerHTML = filtradas.map(art => {
        const charObj = personagens.find(p => p.id === art.personagem_id);
        const numComentarios = Array.isArray(art.comentarios) ? art.comentarios.length : 0;

        return `
          <div class="fanart-card">
            <img class="fanart-thumb" src="${escapeHtml(art.imagem_url)}" alt="${escapeHtml(art.titulo)}" onclick="abrirModal(${art.id})" onerror="this.src='${DEFAULT_IMG}'">
            <div class="fanart-info">
              <div class="fanart-title" onclick="abrirModal(${art.id})">${escapeHtml(art.titulo)}</div>
              <div class="fanart-artist">por <strong>${escapeHtml(art.artista)}</strong></div>
              ${charObj ? `<a href="perfil.html?id=${charObj.id}" class="fanart-tag">🐴 ${escapeHtml(charObj.nome)}</a>` : `<span class="fanart-tag">${escapeHtml(art.categoria || 'Fanart')}</span>`}
              <div class="fanart-footer">
                <button type="button" class="btn-orkut" onclick="curtirArt(${art.id})">❤️ ${art.likes || 0}</button>
                <a href="javascript:void(0)" onclick="abrirModal(${art.id})">💬 ${numComentarios}</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function salvarFanart(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSalvarArt');
      btn.disabled = true;
      btn.innerText = 'Publicando...';

      const charVal = document.getElementById('artPersonagem').value;
      const novaArt = {
        titulo: document.getElementById('artTitulo').value.trim(),
        artista: document.getElementById('artArtista').value.trim(),
        imagem_url: document.getElementById('artUrl').value.trim(),
        personagem_id: charVal ? parseInt(charVal) : null,
        categoria: document.getElementById('artCategoria').value,
        descricao: document.getElementById('artDescricao').value.trim(),
        likes: 0,
        comentarios: []
      };

      const { data, error } = await supabaseClient
        .from('fanarts')
        .insert([novaArt])
        .select()
        .single();

      btn.disabled = false;
      btn.innerText = '🎨 Publicar na Galeria';

      if (error) {
        alert('Erro ao publicar fanart: ' + error.message);
        return;
      }

      fanarts.unshift(data);
      renderizarGaleria();
      document.getElementById('formFanart').reset();
      atualizarPreview('');
      document.getElementById('formFanart').style.display = 'none';
    }

    async function curtirArt(id) {
      const art = fanarts.find(a => a.id === id);
      if (!art) return;
      const novosLikes = (art.likes || 0) + 1;

      const { error } = await supabaseClient
        .from('fanarts')
        .update({ likes: novosLikes })
        .eq('id', id);

      if (!error) {
        art.likes = novosLikes;
        renderizarGaleria();
        if (artAbertaId === id) {
          document.getElementById('modalBtnLike').innerText = `❤️ Curtir (${novosLikes})`;
        }
      }
    }

    function abrirModal(id) {
      const art = fanarts.find(a => a.id === id);
      if (!art) return;

      artAbertaId = id;
      const charObj = personagens.find(p => p.id === art.personagem_id);

      document.getElementById('modalTitulo').innerText = art.titulo;
      document.getElementById('modalImg').src = art.imagem_url;
      document.getElementById('modalArtista').innerText = art.artista;
      document.getElementById('modalCategoria').innerText = art.categoria || 'Fanart';
      document.getElementById('modalPersonagem').innerHTML = charObj
        ? `<a href="perfil.html?id=${charObj.id}">${escapeHtml(charObj.nome)}</a>`
        : 'Geral';
      document.getElementById('modalDescricao').innerText = art.descricao || 'Sem descrição.';
      document.getElementById('modalBtnLike').innerText = `❤️ Curtir (${art.likes || 0})`;

      renderizarComentariosModal(art.comentarios || []);
      document.getElementById('artModal').style.display = 'flex';
    }

    function renderizarComentariosModal(lista) {
      const box = document.getElementById('modalComentarios');
      box.innerHTML = lista.length
        ? lista.map(c => `
          <div class="comment-item">
            <strong style="color:#983b8c;">${escapeHtml(c.autor)}:</strong> ${escapeHtml(c.texto)}
            <span style="color:#999; font-size:9px;">(${escapeHtml(c.data || '')})</span>
          </div>
        `).join('')
        : '<p style="color:#777; font-size:11px;">Nenhum comentário ainda.</p>';
    }

    async function enviarComentarioModal() {
      if (!artAbertaId) return;
      const art = fanarts.find(a => a.id === artAbertaId);
      if (!art) return;

      const autor = document.getElementById('comentAutor').value.trim();
      const texto = document.getElementById('comentTexto').value.trim();
      if (!autor || !texto) {
        alert('Preencha seu nome e o comentário!');
        return;
      }

      const novos = [...(art.comentarios || []), {
        autor,
        texto,
        data: new Date().toLocaleDateString('pt-BR')
      }];

      const { error } = await supabaseClient
        .from('fanarts')
        .update({ comentarios: novos })
        .eq('id', art.id);

      if (!error) {
        art.comentarios = novos;
        renderizarComentariosModal(novos);
        renderizarGaleria();
        document.getElementById('comentTexto').value = '';
      }
    }

    function curtirArtModal() {
      if (artAbertaId) curtirArt(artAbertaId);
    }

    async function excluirArtModal() {
      if (!artAbertaId) return;
      if (!confirm('Tem certeza que deseja excluir esta fanart?')) return;

      const { error } = await supabaseClient.from('fanarts').delete().eq('id', artAbertaId);
      if (!error) {
        fanarts = fanarts.filter(a => a.id !== artAbertaId);
        fecharModal();
        renderizarGaleria();
      }
    }

    function fecharModal() {
      document.getElementById('artModal').style.display = 'none';
      artAbertaId = null;
    }

    function fecharModalFora(e) {
      if (e.target.id === 'artModal') fecharModal();
    }

    iniciar();
  </script>
</body>
</html>
